name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --mode production
        env:
          NODE_ENV: production
      
      - name: Verify build output
        run: |
          echo "Checking dist folder contents:"
          ls -la dist/ || echo "ERROR: dist folder not found"
          echo ""
          echo "Checking for index.html:"
          test -f dist/index.html && echo "✓ index.html exists" || echo "✗ index.html NOT found"
          echo ""
          echo "Checking index.html base path:"
          grep -q 'qrzap-promotion' dist/index.html && echo "✓ Base path correct" || echo "⚠ Base path might be incorrect"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

